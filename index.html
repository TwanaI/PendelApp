<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pendelapp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Pendelapp</h1>
    <p class="muted">Visar nästa tre pendeltågsavgångar i dina två riktningar.</p>

    <section id="status" class="status">Startar…</section>

    <section class="current">
      <div>
        <span class="label">Sträckor</span>
        <strong>Jordbro ↔ Stockholm Södra</strong>
      </div>
      <button id="refreshButton">Uppdatera</button>
    </section>

    <section id="jordbroCard" class="card">
      <h2>Jordbro → Stockholm Södra</h2>
      <div id="jordbroToSodra"></div>
    </section>

    <section id="sodraCard" class="card">
      <h2>Stockholm Södra → Jordbro</h2>
      <div id="sodraToJordbro"></div>
    </section>

    <p class="credit">Data från Trafiklab / SL Transport API.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
